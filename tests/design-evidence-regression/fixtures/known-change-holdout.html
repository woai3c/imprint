<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known change holdout</title>
    <script>
      if (new URLSearchParams(location.search).get('variant') === 'changed') {
        document.documentElement.dataset.variant = 'changed'
      }
    </script>
    <style>
      :root {
        --canvas: #f8f4ed;
        --surface: #ffffff;
        --ink: #241d18;
        --action: #176b54;
        --radius: 6px;
      }
      :root[data-variant='changed'] {
        --action: #a23b24;
        --radius: 20px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: 16px;
        line-height: 1.5;
      }
      main {
        width: min(880px, calc(100% - 64px));
        margin: 56px auto;
      }
      .panel {
        padding: 24px;
        border: 1px solid #d7cdbf;
        border-radius: var(--radius);
        background: var(--surface);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 36px;
        line-height: 1.2;
      }
      p {
        margin: 0;
      }
      button {
        margin-top: 24px;
        padding: 12px 20px;
        border: 0;
        border-radius: var(--radius);
        background: var(--action);
        color: #ffffff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Independent holdout surface</h1>
        <p>Only the action color and radius change; typography and spacing remain fixed.</p>
        <button type="button">Review evidence</button>
      </section>
    </main>
  </body>
</html>
