<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painted HTML with a short body</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        background: #112233;
      }
      body {
        margin: 0;
        background: #f3f4f6;
        color: #1f2937;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        height: 120px;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Short authored content</h1>
      <p>The independently painted HTML element remains visible below this body.</p>
    </main>
  </body>
</html>
